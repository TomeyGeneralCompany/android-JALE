plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.tomeygeneral.elgrande'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tomeygeneral.elgrande'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.14.0-android.1'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        websiteRelease {
            def ks = System.getenv('EL_GRANDE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('EL_GRANDE_STORE_PASSWORD')
                keyAlias System.getenv('EL_GRANDE_KEY_ALIAS')
                keyPassword System.getenv('EL_GRANDE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('EL_GRANDE_KEYSTORE')) signingConfig signingConfigs.websiteRelease
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
    }
    sourceSets {
        main {
            srcDirs = ['src/main/python', '../../integrations/all_by_devoll']
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
}


// Generate a launcher icon from the existing Tomey General Company PNG.
// Keep the asset in its original location; don't duplicate or redraw the logo.
def jaleIconResources = layout.buildDirectory.dir("generated/jale-launcher-res")
android.sourceSets.main.res.srcDir(jaleIconResources)

tasks.register('prepareJaleLauncherIcon', Copy) {
    from(file('../../integrations/all_by_devoll/brand/tomey.png'))
    into(jaleIconResources.map { it.dir('drawable') })
    rename('tomey.png', 'jale_launcher.png')
}
tasks.named('preBuild').configure {
    dependsOn(tasks.named('prepareJaleLauncherIcon'))
}
