plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def coachWeb = rootProject.file('call-coach')
def coachAssets = layout.buildDirectory.dir('generated/call-coach-assets')
def installCoachWeb = tasks.register('installCoachWeb', Exec) {
    workingDir coachWeb
    commandLine 'npm', 'ci', '--ignore-scripts', '--no-audit', '--no-fund'
    inputs.files new File(coachWeb, 'package.json'), new File(coachWeb, 'package-lock.json')
    outputs.dir new File(coachWeb, 'node_modules')
}
def bundleCoachWeb = tasks.register('bundleCoachWeb', Exec) {
    dependsOn installCoachWeb
    workingDir coachWeb
    commandLine 'npm', 'run', 'bundle'
    inputs.files new File(coachWeb, 'sip-entry.js'), new File(coachWeb, 'package-lock.json'),
            new File(coachWeb, 'SIP-LICENSE.md'), new File(coachWeb, 'MOONSHINE-LICENSE.md')
    outputs.dir coachAssets
    doLast {
        copy {
            from coachWeb
            include 'SIP-LICENSE.md', 'MOONSHINE-LICENSE.md'
            into coachAssets
        }
    }
}

android {
    namespace 'com.tomeygeneral.elgrande'
    sourceSets.main.assets.srcDir(coachAssets)
    compileSdk 35
    ndkVersion "27.2.12479018"
    // GGUF is packaged without compression, allowing size verification and fast extraction.
    androidResources { noCompress += ["gguf"] }
    externalNativeBuild { cmake { path file("src/main/cpp/CMakeLists.txt"); version "3.22.1" } }

    defaultConfig {
        applicationId 'com.tomeygeneral.elgrande'
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName '0.14.0-android.1'
        ndk {
            abiFilters 'arm64-v8a'
            if (project.hasProperty('ciEmulator')) abiFilters 'x86_64'
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        websiteRelease {
            def ks = System.getenv('EL_GRANDE_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('EL_GRANDE_STORE_PASSWORD')
                keyAlias System.getenv('EL_GRANDE_KEY_ALIAS')
                keyPassword System.getenv('EL_GRANDE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('EL_GRANDE_KEYSTORE')) signingConfig signingConfigs.websiteRelease
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        pip {
            install 'tzdata==2026.2'
        }
    }
    sourceSets {
        main {
            srcDirs = ['src/main/python', '../../integrations/all_by_devoll']
        }
    }
}

tasks.named('preBuild').configure { dependsOn bundleCoachWeb }

dependencies {
    implementation 'ai.moonshine:moonshine-voice:0.1.6'
    implementation 'androidx.core:core:1.15.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
