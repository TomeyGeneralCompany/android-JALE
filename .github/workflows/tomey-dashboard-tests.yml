name: Tomey dashboard and business regression tests

on:
  push:
    paths:
      - 'integrations/all_by_devoll/**'
      - '.github/workflows/tomey-dashboard-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: All shop desk regression tests
        run: python -m unittest discover -s integrations/all_by_devoll -p 'test_*.py'
