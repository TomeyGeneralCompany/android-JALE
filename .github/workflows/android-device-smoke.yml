name: JALE Android emulator smoke test

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'integrations/all_by_devoll/**'
      - '.github/workflows/android-device-smoke.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Android SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start real Android emulator and run app integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            gradle --no-daemon -p android :app:connectedDebugAndroidTest -PciEmulator
            result=$?
            adb logcat -d -t 6000 > jale-android-logcat.txt || true
            exit "$result"
      - name: Preserve diagnostics captured before emulator shutdown
        if: failure()
        run: test -f jale-android-logcat.txt || touch jale-android-logcat.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: jale-emulator-failure-log
          path: jale-android-logcat.txt
          if-no-files-found: ignore
